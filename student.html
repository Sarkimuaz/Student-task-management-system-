<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #f4f6f9; padding-bottom: 80px; }
  .hidden { display: none; }
  
  .header { background: #2563eb; color: white; padding: 15px 20px; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 20px; }
  .notif { position: relative; cursor: pointer; }
  .notif-badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; }
  
  .container { padding: 20px; }
  .section-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #1e293b; }
  
  .task-card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 15px; border-left: 5px solid #f59e0b; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .task-card.marked { border-left-color: #10b981; }
  .task-card.pending { border-left-color: #f59e0b; }
  
  .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .status { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; color: white; }
  .status.pending { background: #f59e0b; }
  .status.marked { background: #10b981; }
  
  .form-box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #334155; }
  .form-group select, .form-group textarea, .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
  .btn { background: #2563eb; color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
  .btn-logout { background: #ef4444; }
  
  .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #e2e8f0; }
  .nav-item { text-align: center; color: #64748b; font-size: 12px; cursor: pointer; }
  .nav-item.active { color: #2563eb; }
</style>
</head>
<body>

  <div class="header">
    <h1 id="pageTitle">Home</h1>
    <div class="notif" onclick="showPage('notifications')">
      <svg fill="white" width="24" height="24" viewBox="0 0 20 20"><path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"></path></svg>
      <span class="notif-badge" id="notifCount">0</span>
    </div>
  </div>

  <!-- PAGE: HOME -->
  <div id="page-home" class="container">
    <div class="form-box">
      <h2 class="section-title">Submit Task</h2>
      <p style="margin-bottom:10px; color:#64748b">Department: <b id="studentDept"></b></p>
      <div class="form-group">
        <label>Choose Assignment</label>
        <select id="taskId" onchange="loadQuestion()"><option>Loading tasks...</option></select>
      </div>
      <div id="questionDisplay" class="hidden"></div>
      <div class="form-group hidden" id="answerBox">
        <label>Your Answer</label>
        <textarea id="answer" rows="4"></textarea>
      </div>
      <button class="btn hidden" id="submitBtn" onclick="submitTask()">Submit Answer</button>
    </div>
  </div>

  <!-- PAGE: TASKS -->
  <div id="page-tasks" class="container hidden">
    <h2 class="section-title">My Task Status</h2>
    <div id="myTasksList">Loading...</div>
  </div>

  <!-- PAGE: PROFILE -->
  <div id="page-profile" class="container hidden">
    <h2 class="section-title">Account Settings</h2>
    <div class="form-box">
      <p><strong>Name:</strong> <span id="pName"></span></p>
      <p><strong>Email:</strong> <span id="pEmail"></span></p>
      <p><strong>Department:</strong> <span id="pDept"></span></p>
      <hr style="margin: 15px 0;">
      <div class="form-group"><label>New Name</label><input type="text" id="sName"></div>
      <div class="form-group"><label>New Password</label><input type="password" id="sPassword"></div>
      <button class="btn" onclick="updateProfile()">Update Profile</button>
      <button class="btn btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- PAGE: NOTIFICATIONS -->
  <div id="page-notifications" class="container hidden">
    <h2 class="section-title">Notifications</h2>
    <div id="notifList">No notifications</div>
  </div>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="nav-item active" onclick="showPage('home', this)">Home</div>
    <div class="nav-item" onclick="showPage('tasks', this)">Tasks</div>
    <div class="nav-item" onclick="showPage('profile', this)">Profile</div>
  </div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
  // 1. SAKA CONFIG DIN KA ANAN
const firebaseConfig = {
  apiKey: "AIzaSyA1fy2BvuM-mB...", // Copy daga screenshot
  authDomain: "student-task-something.firebaseapp.com", // Cika shi
  databaseURL: "https://student-task-system-default-rtdb.firebaseio.com/", // Wannan kana dashi
  projectId: "student-task-sy...", // Cika shi
  storageBucket: "student-tas...", // Cika shi
  messagingSenderId: "1678603...", // Cika shi
  appId: "1:167860350961:web:...", // Cika shi
  measurementId: "G-98M6ZGPNX..." // Cika shi
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
  let currentUser = JSON.parse(localStorage.getItem('currentUser'));
  if(!currentUser){ window.location.href = 'login.html'; }
  
  let studentEmail = currentUser.email.replace(/\./g, ',');
  let studentDept = currentUser.dept;

  function showPage(page, el){
    document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.add('hidden'));
    document.getElementById('page-' + page).classList.remove('hidden');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    if(el) el.classList.add('active');
    document.getElementById('pageTitle').innerText = page.charAt(0).toUpperCase() + page.slice(1);

    if(page == 'profile'){
      document.getElementById('pName').innerText = currentUser.name;
      document.getElementById('pEmail').innerText = currentUser.email;
      document.getElementById('pDept').innerText = currentUser.department;
      document.getElementById('sName').value = currentUser.name;
    }
    if(page == 'tasks'){ loadMyTasksStatus(); }
    if(page == 'home'){ 
      document.getElementById('studentDept').innerText = studentDept;
      loadTaskDropDown(); 
    }
  }

  function logout(){ 
    localStorage.removeItem('currentUser'); 
    window.location.href = 'index.html'; 
  }

  // 2. GYARA: YANZU YANA TACE TA DEPARTMENT
  function loadTaskDropDown(){
    db.ref('tasks').once('value', snap=>{
      let options = '<option>Choose your Assignment...</option>';
      snap.forEach(child=>{ 
        let task = child.val();
        if(task.department === studentDept){ // TACE NAN
          options += `<option value="${child.key}">${task.title}</option>` 
        }
      });
      document.getElementById('taskId').innerHTML = options;
    });
  }

  function loadQuestion(){
    let taskId = document.getElementById('taskId').value;
    if(taskId == 'Choose your Assignment...') return;
    db.ref('tasks/' + taskId).once('value', snap=>{
      let t = snap.val();
      document.getElementById('questionDisplay').innerHTML = `<b>Question:</b><p>${t.question}</p>`;
      document.getElementById('questionDisplay').classList.remove('hidden');
      document.getElementById('answerBox').classList.remove('hidden');
      document.getElementById('submitBtn').classList.remove('hidden');
    });
  }

  function submitTask(){
    let taskId = document.getElementById('taskId').value;
    let answer = document.getElementById('answer').value;
    if(taskId=='Choose your Assignment...' || answer==""){ alert("Please select assignment and write answer"); return; }
    
    db.ref('submissions/' + taskId + '/' + studentEmail).set({
      answer: answer, 
      name: currentUser.name, 
      department: studentDept,
      time: Date.now(), 
      status: "pending",
      feedback: ""
    }).then(()=>{
      alert("Submitted Successfully ✓");
      document.getElementById('answer').value = "";
      loadMyTasksStatus();
      showPage('tasks');
    }).catch(err => alert("DB Error: " + err.message));
  }

  function loadMyTasksStatus(){
    db.ref('submissions').once('value', snap=>{
      let html = '';
      snap.forEach(taskSnap=>{
        let taskId = taskSnap.key;
        if(taskSnap.hasChild(studentEmail)){
          let sub = taskSnap.child(studentEmail).val();
          html += `<div class="task-card ${sub.status}">
            <div class="task-header"><h3>${taskId}</h3><span class="status ${sub.status}">${sub.status}</span></div>
            <p><b>Your Answer:</b> ${sub.answer}</p>
            <p><b>Feedback:</b> ${sub.feedback || 'No feedback yet'}</p>
          </div>`;
        }
      });
      document.getElementById('myTasksList').innerHTML = html || "No submissions yet";
    });
  }
  
  function updateProfile(){
    let newName = document.getElementById('sName').value;
     db.ref('users/' + studentEmail).update({ name: newName }).then(()=>{
      currentUser.name = newName;
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      alert("Profile Updated!");
    }).catch(err => alert("DB Error: " + err.message));
  }

  showPage('home');
</script>
</body>
 </html>
