<!DOCTYPE html>
<html>
<head>
<title>Register - Task System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:'Segoe UI'; background:linear-gradient(135deg, #3498db, #8e44ad); display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.box{background:white; padding:30px; border-radius:15px; width:90%; max-width:400px; box-shadow:0 4px 20px rgba(0,0,0,0.3);}
h2{text-align:center; color:#27ae60;}
input, select{width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;}
button{width:100%; padding:12px; background:#27ae60; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;}
a{text-align:center; display:block; margin-top:10px; color:#3498db; text-decoration:none;}
</style>
</head>
<body>
<div class="box">
    <h2>Register</h2>
    <input type="text" id="name" placeholder="Full Name">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
  <label>Role</label>
<select id="role">
  <option value="student">Student</option>
  <option value="teacher">Lecturer</option>
</select>

<label>Department</label>
<select id="dept">
  <option value="">-- Choose Your Department --</option>
  <option value="Computer Science">Computer Science</option>
  <option value="Accounting">Accounting</option>
  <option value="Business Admin">Business Admin</option>
  <option value="Mass Comm">Mass Comm</option>
  <option value="Economics">Economics</option>
</select>
    <button onclick="register()">Register</button>
    <a href="index.html">Already have account? Login</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>

const firebaseConfig = {
  apiKey: "AIzaSyA1fy2BvuM-mBDM5fuZID9NbkMsx-6ie0U",
  authDomain: "student-task-system.firebaseapp.com",
  databaseURL: "https://student-task-system-default-rtdb.firebaseio.com",
  projectId: "student-task-system",
  storageBucket: "student-task-system.firebasestorage.app",
  messagingSenderId: "167860350961",
  appId: "1:167860350961:web:c04e0efbb0c06e2ef31e50"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function register(){ // <- Na gyara nan
  let name = document.getElementById('name').value.trim();
  let email = document.getElementById('email').value.trim();
  let password = document.getElementById('password').value.trim();
  let role = document.getElementById('role').value;
  let dept = document.getElementById('dept').value;
  let data={name,email,password,role, approved: false}; // kara approved: false
if(role=='student')data.department=dept;

  if(name=="" || email=="" || password=="" || role=="" || dept==""){
    alert("Fill all the fields "); 
    return; 
  }

  let key = email.replace(/\./g, '_');

  db.ref('users/' + key).set({
    name, 
    email, 
    password, 
    role, 
    dept,
    status: 'pending'
  })
  .then(()=>{ 
    alert("Registration Successful,Just Wait for Admin to approve"); 
    window.location.href = 'index.html'; 
  })
  .catch((error)=>{
    alert("Error: " + error.message);
  });
} // <- kuma nan
</script>
</body>
</html>
