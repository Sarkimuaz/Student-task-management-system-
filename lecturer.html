<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecturer Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #f4f6f9; padding-bottom: 80px; }
  .hidden { display: none; }
  .header { background: #7c3aed; color: white; padding: 15px 20px; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
  .container { padding: 20px; }
  .section-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #1e293b; }
  .form-box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #334155; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
  .btn { background: #7c3aed; color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
  .btn-mark { background: #10b981; }
  .btn-logout { background: #ef4444; }
  .btn-pdf { background: #2563eb; }
  .submission-card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 15px; border-left: 5px solid #f59e0b; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .submission-card.marked { border-left-color: #10b981; }
  .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #e2e8f0; }
  .nav-item { text-align: center; color: #64748b; font-size: 12px; cursor: pointer; }
  .nav-item.active { color: #7c3aed; }
  .task-card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 15px; border-left: 5px solid #7c3aed; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .expired-badge { background: #ef4444; color: white; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .active-badge { background: #10b981; color: white; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .stats-box { background: white; border-radius: 12px; padding: 15px 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
  .stats-number { font-size: 28px; font-weight: 700; color: #7c3aed; }
  .stats-label { font-size: 14px; color: #64748b; }
</style>
</head>
<body>

  <div class="header">
    <h1 id="pageTitle">Create Task</h1>
  </div>

  <!-- PAGE: CREATE TASK -->
  <div id="page-create" class="container">
    <div class="form-box">
      <h2 class="section-title">Create New Task</h2>
      <div class="form-group">
        <label>Department</label>
        <select id="taskDept">
          <option>Computer Science</option>
          <option>Computer Engineering</option>
          <option>Electrical Engineering</option>
          <option>Civil Engineering</option>
          <option>Medical Laboratory</option>
          <option>Accounting</option>
        </select>
      </div>
      <div class="form-group">
        <label>Course</label>
        <input type="text" id="taskCourse" placeholder="E.g: CSC 101 - Introduction to Programming">
      </div>
      <div class="form-group">
        <label>Task Title</label>
        <input type="text" id="taskTitle" placeholder="E.g: JAVA Assignment 1">
      </div>
      <div class="form-group">
        <label>Question / Description</label>
        <textarea id="taskQuestion" rows="4"></textarea>
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input type="date" id="taskDue">
      </div>
      <button class="btn" onclick="createTask()">Create Task</button>
    </div>
  </div>

  <!-- PAGE: MY TASKS -->
  <div id="page-mytasks" class="container hidden">
    <h2 class="section-title">My Tasks</h2>
    <div id="tasksList">Loading...</div>
  </div>

  <!-- PAGE: SUBMISSIONS -->
  <div id="page-submissions" class="container hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
      <h2 class="section-title" style="margin:0;">Student Submissions</h2>
      <button class="btn btn-pdf" style="width:auto; padding:10px 16px;" onclick="downloadSubmissionsPDF()">
        Download PDF
      </button>
    </div>

    <!-- TOTAL SUBMISSIONS -->
    <div class="stats-box">
      <div>
        <div class="stats-label">Total Submissions</div>
        <div class="stats-number" id="totalSubmissions">0</div>
      </div>
      <div>
        <div class="stats-label">Marked</div>
        <div class="stats-number" id="totalMarked" style="color:#10b981;">0</div>
      </div>
      <div>
        <div class="stats-label">Pending</div>
        <div class="stats-number" id="totalPending" style="color:#f59e0b;">0</div>
      </div>
    </div>

    <div id="submissionsList">Loading...</div>
  </div>

  <!-- PAGE: PROFILE -->
  <div id="page-profile" class="container hidden">
    <h2 class="section-title">Account Settings</h2>
    <div class="form-box">
      <p><strong>Name:</strong> <span id="pName"></span></p>
      <p><strong>Email:</strong> <span id="pEmail"></span></p>
      <p><strong>Department:</strong> <span id="pDept"></span></p>
      <hr style="margin: 15px 0;">
      <div class="form-group"><label>New Name</label><input type="text" id="lName"></div>
      <div class="form-group"><label>New Password</label><input type="password" id="lPassword"></div>
      <button class="btn" onclick="updateProfile()">Update Profile</button>
      <button class="btn btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="nav-item active" onclick="showPage('create', this)">Create</div>
    <div class="nav-item" onclick="showPage('mytasks', this)">My Tasks</div>
    <div class="nav-item" onclick="showPage('submissions', this)">Submissions</div>
    <div class="nav-item" onclick="showPage('profile', this)">Profile</div>
  </div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA1fy2BvuM-mB...",
    authDomain: "student-task-something.firebaseapp.com",
    databaseURL: "https://student-task-system-default-rtdb.firebaseio.com/",
    projectId: "student-task-sy...",
    storageBucket: "student-tas...",
    messagingSenderId: "1678603...",
    appId: "1:167860350961:web:...",
    measurementId: "G-98M6ZGPNX..."
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  
  let currentUser = JSON.parse(localStorage.getItem('currentUser'));
  if(!currentUser || currentUser.role != 'lecturer'){ 
    window.location.href = 'login.html'; 
  }

  function showPage(page, el){
    document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.add('hidden'));
    document.getElementById('page-' + page).classList.remove('hidden');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    if(el) el.classList.add('active');
    document.getElementById('pageTitle').innerText = page.charAt(0).toUpperCase() + page.slice(1);

    if(page == 'profile'){
      document.getElementById('pName').innerText = currentUser.name;
      document.getElementById('pEmail').innerText = currentUser.email;
      document.getElementById('lName').value = currentUser.name;
      document.getElementById('pDept').innerText = currentUser.dept; 
    }
    if(page == 'mytasks'){ loadTasks(); }
    if(page == 'submissions'){ loadSubmissions(); }
  }

  function logout(){ 
    localStorage.removeItem('currentUser'); 
    window.location.href = 'index.html'; 
  }

  function createTask(){
    let title = document.getElementById('taskTitle').value.trim();
    let question = document.getElementById('taskQuestion').value.trim();
    let dept = document.getElementById('taskDept').value;
    let course = document.getElementById('taskCourse').value.trim();
    let due = document.getElementById('taskDue').value;
    
    if(title == "" || question == "" || dept == "" || due == "" || course == ""){ 
      alert("Please fill all the fields"); 
      return; 
    }
    
    let newTaskRef = db.ref('tasks').push();
    newTaskRef.set({
      title: title,
      question: question,
      department: dept,
      course: course,
      due: new Date(due).getTime(),
      createdBy: currentUser.email,
      createdAt: Date.now(),
      status: 'active',
      reminderSent: false
    }).then(()=>{
      alert("Task Created Successfully ✓");
      sendEmailNotification(dept, course, title, due);
      document.getElementById('taskTitle').value = "";
      document.getElementById('taskQuestion').value = "";
      document.getElementById('taskDue').value = "";
      document.getElementById('taskCourse').value = "";
    }).catch(err => alert("DB Error: " + err.message));
  }

  function sendEmailNotification(dept, course, taskTitle, dueDate){
    db.ref('users').once('value', snap=>{
      snap.forEach(userSnap=>{
        let user = userSnap.val();
        if(user.role == 'student' && user.dept == dept){
          let studentEmail = userSnap.key.replace(/,/g, '.'); 
          let studentKey = userSnap.key;

          // Email
          fetch('https://script.google.com/macros/s/NAKA_URL/exec', { 
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
              to: studentEmail,
              subject: `New Assignment: ${taskTitle} (${course})`,
              body: `Hello ${user.name},\n\nA new task has been assigned.\n\nCourse: ${course}\nDepartment: ${dept}\nTask: ${taskTitle}\nDue Date: ${new Date(dueDate).toLocaleDateString()}\n\nPlease login to LMS to submit before deadline.\n\n- LMS System`
            })
          });

          // In-app Notification
          db.ref('notifications/' + studentKey).push({
            title: "New Task Assigned",
            message: `New task "${taskTitle}" for course ${course} has been assigned. Due: ${new Date(dueDate).toLocaleDateString()}`,
            course: course,
            type: "new_task",
            createdAt: Date.now(),
            read: false
          });
        }
      });
    });
  }

  // 24 Hours Reminder + Auto Expire
  function checkRemindersAndExpire(){
    db.ref('tasks').orderByChild('createdBy').equalTo(currentUser.email).once('value', snap=>{
      if(!snap.exists()) return;

      snap.forEach(taskSnap=>{
        let task = taskSnap.val();
        let taskId = taskSnap.key;
        let now = Date.now();
        let timeLeft = task.due - now;

        // Auto Expire
        if(now > task.due && task.status !== 'expired'){
          db.ref('tasks/' + taskId).update({ status: 'expired' });
        }

        // 24 Hours Reminder (only once)
        if(timeLeft > 0 && timeLeft <= 24 * 60 * 60 * 1000 && !task.reminderSent){
          send24HourReminder(task.department, task.course || task.department, task.title, task.due);
          db.ref('tasks/' + taskId).update({ reminderSent: true });
        }
      });
    });
  }

  function send24HourReminder(dept, course, taskTitle, dueDate){
    db.ref('users').once('value', snap=>{
      snap.forEach(userSnap=>{
        let user = userSnap.val();
        if(user.role == 'student' && user.dept == dept){
          let studentEmail = userSnap.key.replace(/,/g, '.');
          let studentKey = userSnap.key;

          // Email Reminder
          fetch('https://script.google.com/macros/s/NAKA_URL/exec', { 
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
              to: studentEmail,
              subject: `Reminder: ${taskTitle} due in 24 hours (${course})`,
              body: `Hello ${user.name},\n\nThis is a reminder that your task is due in less than 24 hours.\n\nCourse: ${course}\nTask: ${taskTitle}\nDue Date: ${new Date(dueDate).toLocaleDateString()}\n\nPlease submit before the deadline.\n\n- LMS System`
            })
          });

          // In-app Notification
          db.ref('notifications/' + studentKey).push({
            title: "Task Due Soon (24 Hours Left)",
            message: `Your task "${taskTitle}" for course ${course} is due in less than 24 hours!`,
            course: course,
            type: "reminder_24h",
            createdAt: Date.now(),
            read: false
          });
        }
      });
    });
  }

  function loadTasks(){
    let container = document.getElementById('tasksList');
    container.innerHTML = "Loading tasks...";
    
    checkRemindersAndExpire();

    db.ref('tasks').orderByChild('createdBy').equalTo(currentUser.email).on('value', snap=>{
      container.innerHTML = "";
      
      if(!snap.exists()){
        container.innerHTML = "<p style='text-align:center; color:gray'>No tasks created yet</p>";
        return;
      }
      
      snap.forEach(taskSnap=>{
        let task = taskSnap.val();
        let taskId = taskSnap.key;
        let isExpired = Date.now() > task.due || task.status === 'expired';
        let statusBadge = isExpired 
          ? `<span class="expired-badge">EXPIRED</span>` 
          : `<span class="active-badge">ACTIVE</span>`;
        
        // Count submissions for this task
        db.ref('submissions/' + taskId).once('value', subSnap=>{
          let subCount = subSnap.exists() ? subSnap.numChildren() : 0;

          container.innerHTML += `
            <div class="task-card" style="border-left-color: ${isExpired ? '#ef4444' : '#7c3aed'}">
              <h3>${task.title} ${statusBadge}</h3>
              <p><b>Course:</b> ${task.course || 'N/A'}</p>
              <p><b>Department:</b> ${task.department}</p>
              <p><b>Due Date:</b> ${new Date(task.due).toLocaleDateString()}</p>
              <p><b>Submissions:</b> ${subCount}</p>
              <p><b>Question:</b> ${task.question}</p>
              <div style="margin-top:10px">
                <button onclick="viewSubmissions('${taskId}')" class="btn btn-mark" style="width:auto; padding:8px 12px">View Submissions</button>
                <button onclick="deleteTask('${taskId}')" class="btn btn-logout" style="width:auto; padding:8px 12px">Delete</button>
              </div>
            </div>
          `;
        });
      });
    });
  }

  function deleteTask(taskId){
    if(confirm("Are you sure you want to delete this task?")){
      db.ref('tasks/' + taskId).remove().then(()=>{
        alert("Task Deleted ✓");
      }).catch(err => alert("Error: " + err.message));
    }
  }

  function viewSubmissions(taskId){
    showPage('submissions');
    // Highlight the active nav
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.nav-item')[2].classList.add('active');
    loadSubmissions(taskId);
  }

  function loadSubmissions(filterTaskId = null){
    db.ref('tasks').orderByChild('createdBy').equalTo(currentUser.email).once('value', tasksSnap=>{
      let html = '';
      let promises = [];
      let total = 0;
      let marked = 0;
      let pending = 0;

      tasksSnap.forEach(taskSnap=>{
        let taskId = taskSnap.key;
        let taskData = taskSnap.val();
        
        if(filterTaskId && filterTaskId != taskId) return;

        let p = db.ref('submissions/' + taskId).once('value').then(subSnap=>{
          subSnap.forEach(studentSnap=>{
            let sub = studentSnap.val();
            let studentEmailKey = studentSnap.key;
            
            total++;
            if(sub.status === 'marked') marked++;
            else pending++;

            html += `<div class="submission-card ${sub.status}">
              <h3>${taskData.title}</h3>
              <p><b>Course:</b> ${taskData.course || 'N/A'}</p>
              <p><b>Student:</b> ${sub.name} - ${sub.department}</p>
              <p><b>Answer:</b> ${sub.answer}</p>
              <p><b>Status:</b> ${sub.status}</p>
              ${sub.marks ? `<p><b>Marks:</b> ${sub.marks}</p>` : ''}
              
              <div class="form-group" style="margin-top:12px">
                <label>Marks / Score</label>
                <input type="text" id="marks_${studentEmailKey}" placeholder="E.g: 18/20" value="${sub.marks || ''}">
              </div>
              <textarea id="feedback_${studentEmailKey}" placeholder="Write feedback..." rows="3">${sub.feedback || ''}</textarea>
              <button class="btn btn-mark" onclick="markTask('${taskId}', '${studentEmailKey}')">Mark & Send Feedback</button>
            </div>`;
          });
        });
        promises.push(p);
      });
      
      Promise.all(promises).then(()=>{
        document.getElementById('submissionsList').innerHTML = html || "<p style='text-align:center;color:gray'>No submissions yet</p>";
        document.getElementById('totalSubmissions').innerText = total;
        document.getElementById('totalMarked').innerText = marked;
        document.getElementById('totalPending').innerText = pending;
      });
    });
  }

  function markTask(taskId, studentEmailKey){
    let feedback = document.getElementById('feedback_' + studentEmailKey).value;
    let marks = document.getElementById('marks_' + studentEmailKey).value;

    db.ref('submissions/' + taskId + '/' + studentEmailKey).update({
      feedback: feedback,
      marks: marks,
      status: "marked",
      markedAt: Date.now()
    }).then(()=>{
      alert("Marked Successfully ✓");
      loadSubmissions();
    });
  }

  function downloadSubmissionsPDF(){
    db.ref('tasks').orderByChild('createdBy').equalTo(currentUser.email).once('value', tasksSnap=>{
      let rows = [];
      let promises = [];

      tasksSnap.forEach(taskSnap=>{
        let taskId = taskSnap.key;
        let taskData = taskSnap.val();

        let p = db.ref('submissions/' + taskId).once('value').then(subSnap=>{
          subSnap.forEach(studentSnap=>{
            let sub = studentSnap.val();
            rows.push([
              taskData.title || '',
              taskData.course || 'N/A',
              sub.name || '',
              sub.regno || '',
              sub.department || '',
            
              sub.marks || '-',
              sub.status || '',
             
            ]);
          });
        });
        promises.push(p);
      });

      Promise.all(promises).then(()=>{
        if(rows.length === 0){
          alert("Babu submissions da za a download");
          return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');

        doc.setFontSize(16);
        doc.text("Student Submissions Record", 14, 15);
        doc.setFontSize(10);
        doc.text("Lecturer: " + (currentUser.name || currentUser.email), 14, 22);
        doc.text("Date: " + new Date().toLocaleDateString(), 14, 28);
        doc.text("Total Submissions: " + rows.length, 14, 34);

        doc.autoTable({
          startY: 40,
          head: [['Task Title', 'Course', 'Student', 'Dept', 'Answer', 'Marks', 'Status', 'Feedback']],
          body: rows,
          styles: { fontSize: 8, cellPadding: 2 },
          headStyles: { fillColor: [124, 58, 237] },
          columnStyles: {
            4: { cellWidth: 40 },
            7: { cellWidth: 30 }
          }
        });

        let fileName = "Submissions_Record_" + new Date().toISOString().slice(0,10) + ".pdf";
        doc.save(fileName);
        alert("PDF an sauke ✓");
      });
    });
  }

  function updateProfile(){
    let newName = document.getElementById('lName').value;
    let userEmail = currentUser.email.replace(/\./g, ',');
    db.ref('users/' + userEmail).update({ name: newName }).then(()=>{
      currentUser.name = newName;
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      alert("Profile Updated!");
    });
  }

  // Run on load
  checkRemindersAndExpire();
  setInterval(checkRemindersAndExpire, 30 * 60 * 1000);

  showPage('create');
</script>
</body>
</html>
