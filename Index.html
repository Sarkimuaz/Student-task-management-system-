<!DOCTYPE html>
<html>
<head>
<title>Login - Task System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:'Segoe UI'; background:linear-gradient(135deg, #3498db, #8e44ad); display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.box{background:white; padding:30px; border-radius:15px; width:90%; max-width:400px; box-shadow:0 4px 20px rgba(0,0,0,0.3);}
h2{text-align:center; color:#3498db;}
input, select{width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;}
button{width:100%; padding:12px; background:#3498db; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;}
a{text-align:center; display:block; margin-top:10px; color:#3498db; text-decoration:none;}
</style>
</head>
<body>
<div class="box">
    <h1 style ="position:center;text-align:center"> Student Task Management System</h1>
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Enter your Email">
    <input type="password" id="password" placeholder="Enter your Password">
    <select id="role">Role
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="admin">Admin</option>
    </select>
    <button onclick="login()">Login</button>
    <a href="register.html">You don't have account? Register</a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA1fy2BvuM-mBDM5fuZID9NbkMsx-6ie0U",
  authDomain: "student-task-system.firebaseapp.com",
  databaseURL: "https://student-task-system-default-rtdb.firebaseio.com",
  projectId: "student-task-system",
  storageBucket: "student-task-system.firebasestorage.app",
  messagingSenderId: "167860350961",
  appId: "1:167860350961:web:c04e0efbb0c06e2ef31e50"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function login(){
    let email = document.getElementById('email').value;
    let password = document.getElementById('password').value;
    let role = document.getElementById('role').value;
    let key = email.replace(/\./g,'_'); // NA GYARA NAN: DAGA ',' ZUWA '_'

    if(email=="" || password==""){ alert(" Enter You Email and Password"); return; }

    // 1. ADMIN NA MUSAMMAN - baya bukatar database
    if(email == "admin@gmail.com" && password == "admin123" && role == "admin"){
        localStorage.setItem('currentUser', JSON.stringify({email, role, name:"Admin"}));
        localStorage.setItem('userEmail', email); // NA KARA WANNAN DON PROFILE YA YI AIKI
        window.location.href = 'Admin_dashboard.html'; // NA GYARA A ZUWA BABBAN A
        return;
    }

    // 2. STUDENT / TEACHER
    db.ref('users/' + key).once('value').then(snap=>{
        let user = snap.val();
        if(user && user.password == password && user.role == role){
            if(user.status != 'approved'){ alert("Please wait for admin to approved "); return; }
            localStorage.setItem('currentUser', JSON.stringify(user));
            localStorage.setItem('userEmail', email); // NA KARA WANNAN DON PROFILE YA YI AIKI
            if(role == "teacher"){ window.location.href = 'Teacher_dashboard.html'; } // NA GYARA BABBAN T
            else { window.location.href = 'Student_dashboard.html'; } // NA GYARA BABBAN S
        } else { 
            alert("Your Email, role or password is incorrect!!! "); 
        }
    }).catch(err=>{
        alert("Error: " + err.message + " \nDuba Firebase Config din ka");
    });
}
</script>
</body>
</html>
