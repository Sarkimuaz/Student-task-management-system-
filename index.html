<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Task System</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
  .login-box h1 { text-align: center; color: #333; margin-bottom: 25px; font-size: 24px; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; font-size: 14px; }
  .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; background: #f8fafc; }
  .btn { background: #667eea; color: white; padding: 14px; border: none; border-radius: 8px; width: 100%; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .btn:hover { background: #5563d4; }
  .link { text-align: center; margin-top: 15px; font-size: 14px; }
  .link a { color: #667eea; text-decoration: none; font-weight: 600; }
  .hidden { display: none; }
</style>
</head>
<body>

  <div class="login-box">
    <h1>Student Task System</h1>
    
    <!-- LOGIN FORM - EMAIL + PASSWORD KAWAI -->
    <div id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail"></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPassword"></div>
      <button class="btn" onclick="login()">Login</button>
      <div class="link">Don't have account? <a href="#" onclick="showRegister()">Register</a></div>
    </div>

    <!-- REGISTER FORM - NAN NE ROLE DA DEPT SUKA KASANCE -->
    <div id="registerForm" class="hidden">
      <div class="form-group"><label>Full Name</label><input type="text" id="regName"></div>
      <div class="form-group"><label>Email</label><input type="email" id="regEmail"></div>
      <div class="form-group"><label>Password</label><input type="password" id="regPassword"></div>
      <div class="form-group">
        <label>Role</label>
        <select id="regRole" onchange="toggleDepartment()">
          <option value="student">Student</option>
          <option value="lecturer">Lecturer</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group" id="deptGroup">
        <label>Department</label>
        <select id="regDept">
          <option>Computer Science</option>
          <option>Computer Engineering</option>
        </select>
      </div>
      <button class="btn" onclick="register()">Register</button>
      <div class="link">Already have account? <a href="#" onclick="showLogin()">Login</a></div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig={apiKey:"SAKA_NAKA_ANAN",authDomain:"student-task-system.firebaseapp.com",databaseURL:"https://student-task-system-default-rtdb.firebaseio.com/",projectId:"student-task-system"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();

function showRegister(){document.getElementById('loginForm').classList.add('hidden');document.getElementById('registerForm').classList.remove('hidden')}
function showLogin(){document.getElementById('registerForm').classList.add('hidden');document.getElementById('loginForm').classList.remove('hidden')}
function toggleDepartment(){let role=document.getElementById('regRole').value;document.getElementById('deptGroup').style.display = role=='student' ? 'block' : 'none'}

function register(){
  let name=regName.value,email=regEmail.value,password=regPassword.value,role=regRole.value,dept=regDept.value,key=email.replace(/\./g,',');
  if(!name||!email||!password){alert("Fill all fields");return}
  let data={name,email,password,role,approved:false};
  if(role=='student')data.department=dept;
  db.ref(role+'s/'+key).set(data).then(()=>{alert("Registration Success! Wait for Admin Approval");showLogin()})
}

function login(){
  let email=loginEmail.value,password=loginPassword.value,key=email.replace(/\./g,',');
  db.ref('students/'+key).once('value').then(s1=>{
    if(s1.exists()){
      let u=s1.val();
      if(u.password==password && u.approved==true){u.role="student";localStorage.setItem('currentUser',JSON.stringify(u));location='student.html'}
      else if(u.password==password && u.approved!=true){alert("Wait for Admin Approval")}
      else{checkLecturer()}
    }else{checkLecturer()}
  });
  
  function checkLecturer(){
    db.ref('lecturers/'+key).once('value').then(s2=>{
      if(s2.exists()){
        let u=s2.val();
        if(u.password==password && u.approved==true){u.role="lecturer";localStorage.setItem('currentUser',JSON.stringify(u));location='lecturer.html'}
        else if(u.password==password && u.approved!=true){alert("Wait for Admin Approval")}
        else{checkAdmin()}
      }else{checkAdmin()}
    });
  }
  
  function checkAdmin(){
    db.ref('admins/'+key).once('value').then(s3=>{
      if(s3.exists() && s3.val().password==password){let u=s3.val();u.role="admin";localStorage.setItem('currentUser',JSON.stringify(u));location='admin.html'}
      else{alert("Invalid Email or Password")}
    });
  }
}
</script>
</body>
</html>
