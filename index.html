<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Task System</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
  .login-box h1 { text-align: center; color: #333; margin-bottom: 25px; font-size: 24px; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; font-size: 14px; }
  .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; background: #f8fafc; }
  .btn { background: #667eea; color: white; padding: 14px; border: none; border-radius: 8px; width: 100%; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .btn:hover { background: #5563d4; }
  .link { text-align: center; margin-top: 15px; font-size: 14px; }
  .link a { color: #667eea; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

  <div class="login-box">
    <h1>Student Task System</h1>
    
    <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="Enter email"></div>
    <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Enter password"></div>
    <div class="form-group">
      <label>Role</label>
      <select id="loginRole">
        <option value="student">Student</option>
        <option value="lecturer">Lecturer</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <button class="btn" onclick="login()">Login</button>
    <div class="link">Don't have account? <a href="register.html">Register</a></div>
  </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig={apiKey:"SAKA_NAKA_ANAN",authDomain:"student-task-system.firebaseapp.com",databaseURL:"https://student-task-system-default-rtdb.firebaseio.com/",projectId:"student-task-system"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

function login(){
  let email=document.getElementById('loginEmail').value;
  let password=document.getElementById('loginPassword').value;
  let role=document.getElementById('loginRole').value;
  let key=email.replace(/\./g,',');
  
  if(email=="" || password==""){alert("Fill all fields");return}
  
  // Zai bincika kai tsaye a cikin role din da aka zaba
  db.ref(role+'s/'+key).once('value').then(snap=>{
    if(snap.exists()){
      let u=snap.val();
      if(u.password==password){
        if(role=='admin' || u.approved==true){ // Admin baya bukatar approval
          u.role=role; 
          localStorage.setItem('currentUser',JSON.stringify(u));
          window.location.href = role+'.html' // zai je student.html ko lecturer.html ko admin.html
        }else{
          alert("Your account is not approved yet. Wait for Admin.")
        }
      }else{alert("Invalid Password")}
    }else{alert("User not found as " + role)}
  }).catch(err=>alert("Error: "+err.message));
}
</script>
</body>
</html>
