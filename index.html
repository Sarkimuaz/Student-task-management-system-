<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Task System</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: #667eea;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.login-box {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
  width: 350px;
}
.login-box h1 {
  text-align: center;
  margin-bottom: 20px;
  color: #333;
}
.form-group {
  margin-bottom: 15px;
}
.form-group label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
  color: #555;
}
.form-group input, .form-group select {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 5px;
  box-sizing: border-box;
}
.btn {
  width: 100%;
  padding: 12px;
  background: #667eea;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}
.btn:hover {
  background: #5563d4;
}
.link {
  text-align: center;
  margin-top: 15px;
}
.link a {
  color: #667eea;
  text-decoration: none;
}
</style>
</head>
<body>

  <div class="login-box">
    <h1>Login</h1>
    
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="example@gmail.com">
    </div>
    
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword">
    </div>

    <div class="form-group">
      <label>Role</label>
      <select id="loginRole">
        <option value="student">Student</option>
        <option value="lecturer">Lecturer</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    
    <button class="btn" onclick="login()">Login</button>
    <div class="link">Don't have account? <a href="register.html">Register</a></div>
  </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
const firebaseConfig={apiKey:"SAKA_NAKA_ANAN",authDomain:"student-task-system.firebaseapp.com",databaseURL:"https://student-task-system-default-rtdb.firebaseio.com/",projectId:"student-task-system"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

function login(){
  let email=document.getElementById('loginEmail').value.trim();
  let password=document.getElementById('loginPassword').value;
  let role=document.getElementById('loginRole').value;
  
  let key = email.replace(/\./g,'_'); // saboda database dinka yana _ 
  
  if(email=="" || password==""){alert("Fill all fields");return}
  
  db.ref('users/'+key).once('value').then(snap=>{
    if(snap.exists()){
      let u=snap.val();
      if(u.password != password){alert("Wrong Password");return}
      if(u.role != role){alert("You are " + u.role + ". Select " + u.role);return}
      
      if(u.role=='admin' || u.approved==true){
        localStorage.setItem('currentUser',JSON.stringify(u));
        window.location.href = u.role+'.html'; 
      }else{
        alert("Not Approved Yet. Contact Admin.");
      }
    }else{alert("User not found")}
  });
}
</script>
</body>
</html>
