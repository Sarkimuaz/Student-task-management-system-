<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Task System</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { 
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
    min-height: 100vh; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    padding: 20px;
  }
  .login-box { 
    background: white; 
    padding: 30px; 
    border-radius: 16px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.2); 
    width: 100%; 
    max-width: 400px; 
  }
  .login-box h1 { 
    text-align: center; 
    color: #333; 
    margin-bottom: 25px; 
    font-size: 24px;
  }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; font-size: 14px; }
  .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; transition: 0.3s; }
  .form-group input:focus, .form-group select:focus { border-color: #667eea; outline: none; }
  .btn { background: #667eea; color: white; padding: 14px; border: none; border-radius: 8px; width: 100%; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
  .btn:hover { background: #5568d3; }
  .link { text-align: center; margin-top: 15px; font-size: 14px; }
  .link a { color: #667eea; text-decoration: none; font-weight: 600; }
  .hidden { display: none; }
</style>
</head>
<body>

  <div class="login-box">
    <h1> Student Task System</h1>
    
    <div id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="Enter your email"></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Enter password"></div>
      <button class="btn" onclick="login()">Login</button>
      <div class="link">Don't have account? <a href="#" onclick="showRegister()">Register</a></div>
    </div>

    <div id="registerForm" class="hidden">
      <div class="form-group"><label>Full Name</label><input type="text" id="regName" placeholder="Enter full name"></div>
      <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="Enter email"></div>
      <div class="form-group"><label>Password</label><input type="password" id="regPassword" placeholder="Min 6 characters"></div>
      <div class="form-group">
        <label>Role</label>
        <select id="regRole" onchange="toggleDepartment()">
          <option value="student">Student</option>
          <option value="lecturer">Lecturer</option>
        </select>
      </div>
      <div class="form-group" id="deptGroup">
        <label>Department</label>
        <select id="regDept">
          <option>Computer Science</option>
          <option>Computer Engineering</option>
          <option>Electrical Engineering</option>
          <option>Mechanical Engineering</option>
        </select>
      </div>
      <button class="btn" onclick="register()">Register</button>
      <div class="link">Already have account? <a href="#" onclick="showLogin()">Login</a></div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "SAKA_NAKA_ANAN",
    authDomain: "student-task-system.firebaseapp.com", 
    databaseURL: "https://student-task-system-default-rtdb.firebaseio.com/",
    projectId: "student-task-system"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function showRegister(){ document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.remove('hidden'); }
  function showLogin(){ document.getElementById('registerForm').classList.add('hidden'); document.getElementById('loginForm').classList.remove('hidden'); }
  function toggleDepartment(){ let role = document.getElementById('regRole').value; document.getElementById('deptGroup').classList.toggle('hidden', role == 'lecturer'); }

  function register(){
    let name = document.getElementById('regName').value;
    let email = document.getElementById('regEmail').value;
    let password = document.getElementById('regPassword').value;
    let role = document.getElementById('regRole').value;
    let department = document.getElementById('regDept').value;
    let emailKey = email.replace(/\./g, ',');

    if(name=="" || email=="" || password==""){ alert("Fill all fields"); return; }
    let userData = { name, email, password, role };
    if(role == 'student') userData.department = department;
    let path = role == 'student' ? 'students/' : 'lecturers/';
    
    db.ref(path + emailKey).set(userData).then(()=>{
      alert("Registration Successful! Now Login"); showLogin();
    }).catch(err => alert("Error: " + err.message));
  }

  function login(){
    let email = document.getElementById('loginEmail').value;
    let password = document.getElementById('loginPassword').value;
    let emailKey = email.replace(/\./g, ',');

    db.ref('students/' + emailKey).once('value').then(snap1=>{
      db.ref('lecturers/' + emailKey).once('value').then(snap2=>{
        let user = snap1.exists() ? snap1.val() : snap2.exists() ? snap2.val() : null;
        
        if(user && user.password == password){
          localStorage.setItem('currentUser', JSON.stringify(user));
          if(user.role == 'student'){ window.location.href = 'student.html'; } 
          else { window.location.href = 'lecturer.html'; }
        } else {
          alert("Invalid Email or Password");
        }
      });
    }).catch(err => alert("DB Error: " + err.message));
  }

  window.onload = function(){
    let currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if(currentUser){
      if(currentUser.role == 'student'){ window.location.href = 'student.html'; } 
      else { window.location.href = 'lecturer.html'; }
    }
  }
</script>
</body>
</html>
